name: FSRPG Build

on:
  push:
    branches: [main]
    paths: ['fsrpg/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['fsrpg/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fsrpg
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build and run regression tests
        run: .\gradlew.bat build --no-daemon
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: fsrpg-neoforge
          path: fsrpg/build/libs/*.jar
          retention-days: 14
