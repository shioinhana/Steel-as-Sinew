plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}
version = mod_version
group = 'org.fsrpg'
base { archivesName = 'fsrpg-neoforge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral() }
dependencies {
    compileOnly files('libs/fsvoxel-renderer-neoforge-0.6.0.jar')
    compileOnly files('libs/fsvoxel-engine-1.0.0.jar')
    testImplementation files('libs/fsvoxel-renderer-neoforge-0.6.0.jar')
    testImplementation files('libs/fsvoxel-engine-1.0.0.jar')
    testImplementation 'com.google.code.gson:gson:2.13.2'
    testImplementation 'org.joml:joml:1.10.8'
    runtimeOnly files('libs/fsvoxel-renderer-neoforge-0.6.0.jar')
}
sourceSets { smoke {}; monitorAgent {} }
dependencies { monitorAgentImplementation 'org.ow2.asm:asm-commons:9.9.1' }
def monitorAgentJar = tasks.register('monitorAgentJar', Jar) {
    archiveFileName = 'fsrpg-test-monitor.jar'
    destinationDirectory = layout.buildDirectory.dir('dev-tools')
    from sourceSets.monitorAgent.output
    from { configurations.monitorAgentRuntimeClasspath.collect { zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Premain-Class': 'org.fsrpg.dev.MonitorAgent' }
}
sourceSets.smoke.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.smoke.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
if (project.hasProperty('rpgJarSmoke')) {
    sourceSets { packagedSmoke {} }
    if (project.hasProperty('smokeJar')) sourceSets.packagedSmoke.output.dir(file(project.property('smokeJar')))
    else sourceSets.packagedSmoke.output.dir([builtBy: tasks.named('jar')], tasks.named('jar').flatMap { it.archiveFile })
    sourceSets.packagedSmoke.output.dir([builtBy: tasks.named('compileSmokeJava')], tasks.named('compileSmokeJava').flatMap { it.destinationDirectory })
    def looseMain = sourceSets.main.output.files
    sourceSets.packagedSmoke.runtimeClasspath = sourceSets.packagedSmoke.output + sourceSets.main.runtimeClasspath.filter { file -> !looseMain.contains(file) }
}
neoForge {
    version = neo_version
    runs {
        client {
            client(); gameDirectory = file('run/client')
            jvmArgument "-javaagent:${layout.buildDirectory.file('dev-tools/fsrpg-test-monitor.jar').get().asFile.absolutePath}"
            if(project.hasProperty('spearProfile')) jvmArgument "-XX:StartFlightRecording=filename=${file('verification/spear-underarm-turn-20261014/solver-profile.jfr').absolutePath},settings=profile,dumponexit=true"
            if (project.hasProperty('rpgJarSmoke')) sourceSet.set(sourceSets.packagedSmoke)
            ['spearOrbit','rapierFencing','importedItems','importedItemHands','shoulderInteraction'].each { profile ->
                if(project.hasProperty(profile+'Smoke')) {
                    if(!project.hasProperty('smokeWorld'))throw new GradleException(profile+'Smoke requires a copied marked world')
                    jvmArgument "-Dfsrpg.${profile}Smoke=true"
                    jvmArgument "-Dfsrpg.${profile}World=${project.property('smokeWorld')}"
                    jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
                }
            }
            if (project.hasProperty('weaponSmoke')) {
                jvmArgument '-Dfsrpg.weaponSmoke=true'
                jvmArgument "-Dfsrpg.smokeEvidence=${project.hasProperty('smokeEvidence') ? file(project.property('smokeEvidence')).absolutePath : '../../verification/weapons-r2'}"
            }
            if (project.hasProperty('poseSmoke')) { jvmArgument '-Dfsrpg.poseSmoke=true' }
            if (project.hasProperty('hudSmoke')) {
                if (!project.hasProperty('smokeWorld')) throw new GradleException('hudSmoke requires -PsmokeWorld naming a copied HUD test world')
                jvmArgument '-Dfsrpg.hudSmoke=true'
                jvmArgument "-Dfsrpg.hudWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${project.hasProperty('smokeEvidence') ? file(project.property('smokeEvidence')).absolutePath : file('verification/hud-20261011/game').absolutePath}"
            }
            if (project.hasProperty('collectionSmoke')) {
                if (!project.hasProperty('smokeWorld')) throw new GradleException('collectionSmoke requires a copied collection test world')
                jvmArgument '-Dfsrpg.collectionSmoke=true'
                jvmArgument "-Dfsrpg.collectionWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${project.hasProperty('smokeEvidence') ? file(project.property('smokeEvidence')).absolutePath : file('verification/collections-20261011/game').absolutePath}"
            }
            if(project.hasProperty('legacySkillSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('legacySkillSmoke requires a copied test world');
                jvmArgument '-Dfsrpg.legacySkillSmoke=true'
                jvmArgument "-Dfsrpg.legacySkillWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${project.hasProperty('smokeEvidence') ? file(project.property('smokeEvidence')).absolutePath : file('verification/legacy-skills-20261012-001758/game').absolutePath}"
            }
            if(project.hasProperty('skillTreeSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('skillTreeSmoke requires a copied test world');
                jvmArgument '-Dfsrpg.skillTreeSmoke=true'
                jvmArgument "-Dfsrpg.skillTreeWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${project.hasProperty('smokeEvidence') ? file(project.property('smokeEvidence')).absolutePath : file('verification/skill-tree-20261022/game').absolutePath}"
            }
            if(project.hasProperty('cameraPerfSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('cameraPerfSmoke requires a copied test world');
                jvmArgument '-Dfsrpg.cameraPerfSmoke=true'
                jvmArgument "-Dfsrpg.cameraPerfWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${project.hasProperty('smokeEvidence') ? file(project.property('smokeEvidence')).absolutePath : file('verification/camera-perf-20261022/game').absolutePath}"
            }
            if(project.hasProperty('spearGuardSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('spearGuardSmoke requires a copied test world');
                jvmArgument '-Dfsrpg.spearGuardSmoke=true'
                jvmArgument "-Dfsrpg.spearGuardWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${project.hasProperty('smokeEvidence') ? file(project.property('smokeEvidence')).absolutePath : file('verification/spear-guard-20261022/game').absolutePath}"
            }
            if(project.hasProperty('perfJfr')) jvmArgument "-XX:StartFlightRecording=filename=${file(project.property('perfJfr')).absolutePath},settings=profile,dumponexit=true"
            if(project.hasProperty('spearSolverSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('spearSolverSmoke requires a copied spear test world');
                jvmArgument '-Dfsrpg.spearSolverSmoke=true'
                jvmArgument "-Dfsrpg.spearSolverWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${project.hasProperty('smokeEvidence') ? file(project.property('smokeEvidence')).absolutePath : file('verification/spear-solver-20261012/game').absolutePath}"
            }
            if(project.hasProperty('combatBalanceSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('combatBalanceSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.combatBalanceSmoke=true'
                jvmArgument "-Dfsrpg.combatBalanceWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('creatureCombatSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('creatureCombatSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.creatureCombatSmoke=true'
                jvmArgument "-Dfsrpg.creatureCombatWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('guardComboSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('guardComboSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.guardComboSmoke=true'
                jvmArgument "-Dfsrpg.guardComboWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('dualSourceSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('dualSourceSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.dualSourceSmoke=true'
                jvmArgument "-Dfsrpg.dualSourceWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('combatRevisionSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('combatRevisionSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.combatRevisionSmoke=true'
                jvmArgument "-Dfsrpg.combatRevisionWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('spearGestureSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('spearGestureSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.spearGestureSmoke=true'
                jvmArgument "-Dfsrpg.spearGestureWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('shoulderCombatSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('shoulderCombatSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.shoulderCombatSmoke=true'
                jvmArgument "-Dfsrpg.shoulderCombatWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('burstSwipeSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('burstSwipeSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.burstSwipeSmoke=true'
                jvmArgument "-Dfsrpg.burstSwipeWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('runAirSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('runAirSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.runAirSmoke=true'
                jvmArgument '-Xms2G'
                jvmArgument '-Xmx4G'
                jvmArgument "-Dfsrpg.runAirWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('weaponClashSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('weaponClashSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.weaponClashSmoke=true'
                jvmArgument "-Dfsrpg.weaponClashWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('spearShoulderSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('spearShoulderSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.spearShoulderSmoke=true'
                jvmArgument "-Dfsrpg.spearShoulderWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('defenseFlowSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('defenseFlowSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.defenseFlowSmoke=true'
                jvmArgument "-Dfsrpg.defenseFlowWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('rapierMotionSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('rapierMotionSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.rapierMotionSmoke=true'
                jvmArgument "-Dfsrpg.rapierMotionWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('inspectionCarrySmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('inspectionCarrySmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.inspectionCarrySmoke=true'
                jvmArgument "-Dfsrpg.inspectionCarryWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('groundImpulseSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('groundImpulseSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.groundImpulseSmoke=true'
                jvmArgument "-Dfsrpg.groundImpulseWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('whiteAdventurerSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('whiteAdventurerSmoke requires a copied marked world')
                jvmArgument '-Dfsrpg.whiteAdventurerSmoke=true'
                jvmArgument "-Dfsrpg.whiteAdventurerWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
            }
            if(project.hasProperty('spearPerformanceSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('spearPerformanceSmoke requires a copied marked test world')
                jvmArgument '-Dfsrpg.spearPerformanceSmoke=true'
                jvmArgument "-Dfsrpg.spearPerformanceWorld=${project.property('smokeWorld')}"
                if(project.hasProperty('spearPerformanceUserSettings')) jvmArgument '-Dfsrpg.spearPerformanceUserSettings=true'
                if(project.hasProperty('spearPerformanceQuick')) jvmArgument '-Dfsrpg.spearPerformanceQuick=true'
                if(project.hasProperty('stressSeconds')) jvmArgument "-Dfsrpg.spearPerformanceStressSeconds=${project.property('stressSeconds')}"
                if(project.hasProperty('spearPerformanceStressSeconds')) jvmArgument "-Dfsrpg.spearPerformanceStressSeconds=${project.property('spearPerformanceStressSeconds')}"
                if(project.hasProperty('spearPerformanceExpectFastThrust')) jvmArgument '-Dfsrpg.spearPerformanceExpectFastThrust=true'
                if(project.hasProperty('spearPerformanceRequireQuality')) jvmArgument '-Dfsrpg.spearPerformanceRequireQuality=true'
                if(project.hasProperty('spearPerformanceVideo')) jvmArgument '-Dfsrpg.spearPerformanceVideo=true'
                jvmArgument "-Dfsrpg.smokeEvidence=${file(project.property('smokeEvidence')).absolutePath}"
                if(project.hasProperty('profileOutput')) jvmArgument "-XX:StartFlightRecording=filename=${file(project.property('profileOutput')).absolutePath},settings=profile,dumponexit=true"
            }
            if(project.hasProperty('rapierLockSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('rapierLockSmoke requires a copied marked test world')
                jvmArgument '-Dfsrpg.rapierLockSmoke=true'
                jvmArgument "-Dfsrpg.rapierLockWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${file('verification/rapier-lock-20261016/game').absolutePath}"
            }
            if(project.hasProperty('artSmoke')) { jvmArgument '-Dfsrpg.artSmoke=true'; jvmArgument "-Dfsrpg.smokeEvidence=" + file('verification/five-packs-20261016/game').absolutePath }
            if(project.hasProperty('actionLimitsSmoke')) {
                if(!project.hasProperty('smokeWorld'))throw new GradleException('actionLimitsSmoke requires a copied spear test world');
                jvmArgument '-Dfsrpg.actionLimitsSmoke=true'
                jvmArgument "-Dfsrpg.actionLimitsWorld=${project.property('smokeWorld')}"
                jvmArgument "-Dfsrpg.smokeEvidence=${project.hasProperty('smokeEvidence') ? file(project.property('smokeEvidence')).absolutePath : file('verification/action-limits-20261013/game').absolutePath}"
            }
            if (project.hasProperty('poseSamples')) {
                if (!project.hasProperty('poseSmoke')) throw new GradleException('poseSamples requires -PposeSmoke')
                jvmArgument "-Dfsrpg.poseSamples=${project.property('poseSamples')}"
            }
            if (project.hasProperty('smokeWorld')) { programArgument '--quickPlaySingleplayer'; programArgument project.property('smokeWorld').toString() }
        }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
    }
    mods { fsrpg {
        if (project.hasProperty('rpgJarSmoke')) sourceSet sourceSets.packagedSmoke
        else { sourceSet sourceSets.main; if (project.hasProperty('shoulderInteractionSmoke') || project.hasProperty('importedItemHandsSmoke') || project.hasProperty('importedItemsSmoke') || project.hasProperty('spearOrbitSmoke') || project.hasProperty('rapierFencingSmoke') || project.hasProperty('spearShoulderSmoke') || project.hasProperty('defenseFlowSmoke') || project.hasProperty('rapierMotionSmoke') || project.hasProperty('weaponClashSmoke') || project.hasProperty('runAirSmoke') || project.hasProperty('inspectionCarrySmoke') || project.hasProperty('groundImpulseSmoke') || project.hasProperty('burstSwipeSmoke') || project.hasProperty('shoulderCombatSmoke') || project.hasProperty('spearGestureSmoke') || project.hasProperty('combatRevisionSmoke') || project.hasProperty('dualSourceSmoke') || project.hasProperty('guardComboSmoke') || project.hasProperty('creatureCombatSmoke') || project.hasProperty('combatBalanceSmoke') || project.hasProperty('whiteAdventurerSmoke') || project.hasProperty('spearPerformanceSmoke') || project.hasProperty('rapierLockSmoke') || project.hasProperty('artSmoke') || project.hasProperty('rpgSmoke') || project.hasProperty('poseSmoke') || project.hasProperty('hudSmoke') || project.hasProperty('collectionSmoke') || project.hasProperty('legacySkillSmoke') || project.hasProperty('spearSolverSmoke') || project.hasProperty('actionLimitsSmoke')) sourceSet sourceSets.smoke }
    } }
}
tasks.named('runClient') { dependsOn monitorAgentJar }
if (project.hasProperty('rpgJarSmoke')) sourceSets.packagedSmoke.runtimeClasspath += files(configurations.named('devLaunchConfig'))
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: project.version) }
}
['weaponControlsTest':'org.fsrpg.combat.WeaponControlsTest', 'combatTest': 'org.fsrpg.combat.CombatTest', 'questTest': 'org.fsrpg.quest.QuestTest', 'configTest': 'org.fsrpg.config.ConfigTest', 'rapierTest': 'org.fsrpg.animation.RapierAssetTest', 'skinBindingTest': 'org.fsrpg.client.ArmDeformationTest', 'heldItemTest': 'org.fsrpg.client.HeldItemTransformTest', 'spearAimPoseTest': 'org.fsrpg.client.SpearAimPoseTest', 'poseLayersTest': 'org.fsrpg.client.PoseLayersTest', 'presentationMotionTest': 'org.fsrpg.client.PresentationMotionTest', 'legDeformationTest': 'org.fsrpg.client.LegDeformationTest', 'idleInspectionTest': 'org.fsrpg.client.IdleInspectionTest'].each { taskName, className ->
    tasks.register(taskName, JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = className
        jvmArgs '-Dfile.encoding=UTF-8'
    }
}
tasks.named('test') { enabled = false }
